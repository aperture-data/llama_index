name: Prepare ApertureDB SDK
description: Pull the OCI wheel when testing the ApertureDB integrations or their core dependency
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if ! git diff --quiet "$BASE_SHA"...HEAD -- llama-index-core \
          'llama-index-integrations/*/llama-index-*-stores-ApertureDB/**' \
          scripts/prepare_aperturedb_sdk.py .github/actions/prepare-aperturedb-sdk; then
          echo 'needed=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: oras-project/setup-oras@v1
      if: steps.scope.outputs.needed == 'true'
      with:
        version: 1.3.0
    - name: Fetch the release wheel
      if: steps.scope.outputs.needed == 'true'
      shell: bash
      run: python scripts/prepare_aperturedb_sdk.py
